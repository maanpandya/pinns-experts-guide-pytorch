# Expert's Guide (arXiv:2308.08468), Allen-Cahn ablation, Table 2 row 4 (no grad norm):
# Fourier features + RWF + causal weighting, grad-norm weighting OFF (lambda = 1).
# Paper: rel. L2 = 7.51e-3, 16.36 min. Section numbers refer to the paper; values it does not
# state follow the authors' code and configs (jaxpi; see docs/implementation.md).
name: ablation_no_grad_norm
device: auto
problem:
  name: allen_cahn
  reference: data/allen_cahn_ref.npz
model:
  arch: mlp                 # Sec. 7: 4 hidden layers x 256, tanh, Glorot init
  hidden_dim: 256
  num_layers: 4
  activation: tanh
  periodic: true            # Sec. 6.3: exact periodic embedding, in every row
  fourier:
    enabled: true
    scale: 1.0              # jaxpi
    embed_dim: 256          # jaxpi: 128 frequencies, each a cosine and a sine
    trainable: true         # jaxpi
  rwf:
    enabled: true
    mu: 0.5                 # jaxpi
    sigma: 0.1              # jaxpi
    scale_param: direct     # jaxpi trains exp(s); "log" trains s (Algorithm 2)
optim:
  lr: 1.0e-3                # Sec. 7
  decay_rate: 0.9           # Sec. 7
  decay_steps: 2000         # Sec. 7
  staircase: false          # jaxpi: continuous decay
  warmup_steps: 0
training:
  steps: 200000             # jaxpi
  batch_size: 4096          # Sec. 7
  ic_sampling: grid         # jaxpi: IC loss on the 512 x-points of the reference grid
  n_ic: 4096                # only used with ic_sampling: random
  seed: 0
  derivatives: autograd     # or func: same values up to round-off
  compile: false            # true: torch.compile each step, about 1.5x faster on GPU (needs Triton)
weighting:
  scheme: none              # all lambda fixed at 1
  update_every: 1000        # Algorithm 1
  momentum: 0.9             # Algorithm 1
  grad_norm_reduction: mean # jaxpi; "sum" is eqs. 2.12-2.14 as printed
causal:
  enabled: true
  tol: 1.0                  # Algorithm 1
  num_chunks: 32            # jaxpi
logging:
  out_dir: runs/allen_cahn/ablation/{name}
  checkpoint_dir: ""
  log_every: 100
  eval_every: 1000
  checkpoint_every: 5000
