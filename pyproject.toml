[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "piratenets"
version = "0.1.0"
description = "PyTorch implementation of the Expert's Guide PINN training pipeline, with a reproduction of its Allen-Cahn ablation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maan Pandya" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
compile = ["triton-windows; sys_platform == 'win32'"]  # Linux CUDA wheels of PyTorch already include Triton

[project.urls]
Homepage = "https://github.com/maanpandya/piratenets-pytorch"

[tool.setuptools.packages.find]
include = ["piratenets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
